name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  ci-ok:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify static site files
        run: |
          test -s index.html
          test -s robots.txt
          test -f .nojekyll
      - name: Verify legacy handoff pages
        run: python3 .github/check-handoffs.py
