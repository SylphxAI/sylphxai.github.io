name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  ci-ok:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify static site files
        run: |
          test -s index.html
          test -s robots.txt
          test -f .nojekyll
      - name: Verify Lockdocs page handoffs
        run: |
          for f in lockdocs/*.html lockdocs/*/*.html; do
            [ "$f" = lockdocs/index.html ] && continue
            grep -qx '<meta name="robots" content="noindex, follow">' "$f"
            url=$(sed -n 's|^<link rel="canonical" href="\(https://lockdocs\.sylphx\.com/[^"]*\)">$|\1|p' "$f")
            test "$(printf '%s\n' "$url" | grep -c .)" = 1
            grep -qF "<a href=\"$url\">" "$f"
            if grep -qiE '<script|http-equiv' "$f"; then echo "$f must not use a script or refresh"; exit 1; fi
          done
